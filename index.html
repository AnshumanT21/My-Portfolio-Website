    <script>
      // Set the theme before first paint so there is no flash. The site opens in night
      // mode by default; pulling the lamp saves the visitor's own choice for next time.
      try {
        document.documentElement.dataset.theme = localStorage.getItem('theme') || 'night';
      } catch (e) {
        document.documentElement.dataset.theme = 'night';
      }
